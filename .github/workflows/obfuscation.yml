name: Obfuscation transforms

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obfuscation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transform-smoke:
    name: Clang transform smoke tests (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ python3 pkg-config openssl \
            libcurl4-openssl-dev libobjc-13-dev

      - name: Configure Clang and LLVM tools
        run: |
          cmake -S llvm -B build-llvm-project -G Ninja \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build clang and opt
        run: cmake --build build-llvm-project --target clang opt --parallel 4

      - name: Verify all custom transforms at O0 and O2
        run: |
          python3 tests/obfuscation/test_transforms.py \
            --clang build-llvm-project/bin/clang \
            --opt build-llvm-project/bin/opt \
            --work-dir build-llvm-project/transform-smoke

      - name: Verify convergence-control IR is preserved
        run: |
          python3 tests/obfuscation/test_convergence.py \
            --clang build-llvm-project/bin/clang \
            --opt build-llvm-project/bin/opt \
            --work-dir build-llvm-project/convergence-tests
          python3 tests/obfuscation/test_cfg_convergence.py \
            --clang build-llvm-project/bin/clang \
            --opt build-llvm-project/bin/opt \
            --work-dir build-llvm-project/convergence-tests

      - name: Verify real HTTPS clients in four languages
        run: |
          python3 tests/obfuscation/test_http_programs.py \
            --clang build-llvm-project/bin/clang \
            --opt build-llvm-project/bin/opt \
            --work-dir build-llvm-project/http-integration

      - name: Verify Objective-C runtime metadata survives string obfuscation
        run: |
          python3 tests/obfuscation/test_objc_metadata.py \
            --clang build-llvm-project/bin/clang \
            --opt build-llvm-project/bin/opt \
            --work-dir build-llvm-project/objc-metadata

      - name: Upload emitted IR on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transform-smoke-ir
          path: |
            build-llvm-project/transform-smoke/*.ll
            build-llvm-project/convergence-tests/*.ll
            build-llvm-project/http-integration/*.ll
            build-llvm-project/objc-metadata/*.ll
          if-no-files-found: ignore
