name: Obfuscation transforms

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obfuscation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transform-smoke:
    name: Clang transform smoke tests (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ python3 pkg-config openssl \
            libcurl4-openssl-dev libobjc-13-dev

      - name: Configure Clang and LLVM tools
        run: |
          cmake -S llvm -B build-llvm-project -G Ninja \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_INCLUDE_TESTS=ON \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Clang, LLVM tools, and obfuscation unit tests
        run: cmake --build build-llvm-project --target clang opt llvm-objdump ObfuscationTests --parallel 4

      - name: Run obfuscation unit tests
        run: build-llvm-project/unittests/Transforms/Obfuscation/ObfuscationTests

      - name: Verify portable transforms at O0 and O2
        run: |
          python tests/obfuscation/run_portable.py \
            --clang build-llvm-project/bin/clang \
            --opt build-llvm-project/bin/opt \
            --objdump build-llvm-project/bin/llvm-objdump \
            --work-dir build-llvm-project/portable-smoke

      - name: Verify real HTTPS clients in four languages
        run: |
          python tests/obfuscation/test_http_programs.py \
            --clang build-llvm-project/bin/clang \
            --opt build-llvm-project/bin/opt \
            --work-dir build-llvm-project/http-integration

      - name: Upload emitted IR on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transform-smoke-ir
          path: |
            build-llvm-project/portable-smoke/**/*.ll
            build-llvm-project/http-integration/*.ll
          if-no-files-found: ignore
