name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate tag on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is reachable from main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} is not on origin/main"
            exit 1
          fi

  build-and-package:
    name: Build and package (${{ matrix.target }})
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-2022
            archive: llvm-obfuscator-${{ github.ref_name }}-windows-amd64.zip
          - target: macos-arm64
            runner: macos-15
            archive: llvm-obfuscator-${{ github.ref_name }}-macos-arm64.zip
          - target: linux-amd64
            runner: ubuntu-24.04
            archive: llvm-obfuscator-${{ github.ref_name }}-linux-amd64.zip
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            archive: llvm-obfuscator-${{ github.ref_name }}-linux-arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ zip unzip python3 pkg-config openssl \
            libcurl4-openssl-dev libobjc-13-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          command -v zip
          command -v unzip

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cmake -S llvm -B build-llvm-project -G Ninja \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cmake -S llvm -B build-llvm-project -G Ninja \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S llvm -B build-llvm-project -G Ninja `
            -DLLVM_ENABLE_PROJECTS=clang `
            -DLLVM_PARALLEL_LINK_JOBS=1 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Clang and LLVM tools (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cmake --build build-llvm-project --target clang opt llvm-objdump --parallel 4

      - name: Build Clang and LLVM tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build-llvm-project --target clang opt llvm-objdump --parallel 4

      - name: Build Clang's linker plugin (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build-llvm-project --target LTO --parallel 4

      - name: Package archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          OUT_DIR="dist"
          PKG_DIR="${OUT_DIR}/llvm-obfuscator-${TAG}-${TARGET}"

          mkdir -p "${PKG_DIR}/bin"
          mkdir -p "${PKG_DIR}/lib"

          for tool in clang clang++ opt llvm-objdump; do
            test -x "build-llvm-project/bin/${tool}"
          done
          test -d build-llvm-project/lib/clang

          cp -a build-llvm-project/bin/clang* "${PKG_DIR}/bin/"
          cp -a build-llvm-project/bin/opt* "${PKG_DIR}/bin/"
          cp -a build-llvm-project/bin/llvm-objdump "${PKG_DIR}/bin/"
          cp -a build-llvm-project/lib/clang "${PKG_DIR}/lib/"
          if [[ "${{ matrix.target }}" == "macos-arm64" ]]; then
            test -f build-llvm-project/lib/libLTO.dylib
            cp -a build-llvm-project/lib/libLTO*.dylib "${PKG_DIR}/lib/"
          fi
          cp README.md "${PKG_DIR}/README.md"

          for tool in clang clang++ opt llvm-objdump; do
            test -x "${PKG_DIR}/bin/${tool}"
          done
          (cd "${OUT_DIR}" && zip -r "${{ matrix.archive }}" "llvm-obfuscator-${TAG}-${TARGET}")

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${env:GITHUB_REF_NAME}"
          $target = "${{ matrix.target }}"
          $outDir = "dist"
          $pkgDir = Join-Path $outDir "llvm-obfuscator-$tag-$target"
          $binDir = Join-Path $pkgDir "bin"
          $libDir = Join-Path $pkgDir "lib"

          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null

          foreach ($tool in @('clang.exe', 'clang++.exe', 'opt.exe', 'llvm-objdump.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'build-llvm-project/bin' $tool) -PathType Leaf)) {
              throw "Required build tool is missing: $tool"
            }
          }
          if (-not (Test-Path -LiteralPath 'build-llvm-project/lib/clang' -PathType Container)) {
            throw 'Required Clang resource directory is missing'
          }

          Copy-Item build-llvm-project/bin/clang*.exe -Destination $binDir -ErrorAction Stop
          Copy-Item build-llvm-project/bin/opt*.exe -Destination $binDir -ErrorAction Stop
          Copy-Item build-llvm-project/bin/llvm-objdump.exe -Destination $binDir -ErrorAction Stop
          Copy-Item build-llvm-project/lib/clang -Destination $libDir -Recurse -Force -ErrorAction Stop

          Copy-Item README.md -Destination (Join-Path $pkgDir "README.md")

          foreach ($tool in @('clang.exe', 'clang++.exe', 'opt.exe', 'llvm-objdump.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $binDir $tool) -PathType Leaf)) {
              throw "Required packaged tool is missing: $tool"
            }
          }

          $archivePath = Join-Path $outDir "${{ matrix.archive }}"
          if (Test-Path $archivePath) { Remove-Item $archivePath -Force }
          Compress-Archive -Path $pkgDir -DestinationPath $archivePath

      - name: Extract and validate archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist/verify
          unzip -q "dist/${{ matrix.archive }}" -d dist/verify
          PKG_DIR="dist/verify/llvm-obfuscator-${GITHUB_REF_NAME}-${{ matrix.target }}"
          PKG_ROOT="$(cd "${PKG_DIR}" && pwd -P)"

          for tool in clang clang++ opt llvm-objdump; do
            test -x "${PKG_ROOT}/bin/${tool}"
          done
          test -d "${PKG_ROOT}/lib/clang"
          RESOURCE_DIR="$("${PKG_ROOT}/bin/clang" -print-resource-dir)"
          RESOURCE_ROOT="$(cd "${RESOURCE_DIR}" && pwd -P)"
          case "${RESOURCE_ROOT}" in
            "${PKG_ROOT}"/lib/clang/*) ;;
            *) echo "Clang resource directory escaped the extracted archive: ${RESOURCE_ROOT}"; exit 1 ;;
          esac

          if [[ "${{ matrix.target }}" == "macos-arm64" ]]; then
            test -f "${PKG_ROOT}/lib/libLTO.dylib"
            for tool in clang opt llvm-objdump; do
              xcrun vtool -show-build "${PKG_ROOT}/bin/${tool}" |
                grep -Eq '^[[:space:]]*minos 14\.0(\.0)?$'
            done
            xcrun vtool -show-build "${PKG_ROOT}/lib/libLTO.dylib" |
              grep -Eq '^[[:space:]]*minos 14\.0(\.0)?$'
          fi

      - name: Extract and validate archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archivePath = Join-Path 'dist' '${{ matrix.archive }}'
          $verifyDir = Join-Path 'dist' 'verify'
          Expand-Archive -LiteralPath $archivePath -DestinationPath $verifyDir -Force
          $pkgDir = Join-Path $verifyDir "llvm-obfuscator-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          $pkgRoot = (Resolve-Path -LiteralPath $pkgDir).Path

          foreach ($tool in @('clang.exe', 'clang++.exe', 'opt.exe', 'llvm-objdump.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path (Join-Path $pkgRoot 'bin') $tool) -PathType Leaf)) {
              throw "Required extracted tool is missing: $tool"
            }
          }
          $expectedRoot = (Resolve-Path -LiteralPath (Join-Path $pkgRoot 'lib/clang')).Path
          $resourceOutput = & (Join-Path $pkgRoot 'bin/clang.exe') -print-resource-dir
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Clang could not report its resource directory' }
          $resourceRoot = (Resolve-Path -LiteralPath ($resourceOutput.Trim())).Path
          $expectedPrefix = $expectedRoot + [IO.Path]::DirectorySeparatorChar
          if (-not $resourceRoot.StartsWith($expectedPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Clang resource directory escaped the extracted archive: $resourceRoot"
          }

      - name: Verify portable transforms from archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          PKG_DIR="dist/verify/llvm-obfuscator-${GITHUB_REF_NAME}-${{ matrix.target }}"
          EXTRA_ARGS=()
          if [[ "${{ matrix.target }}" == "macos-arm64" ]]; then
            EXTRA_ARGS+=(--require-lto)
          fi
          python tests/obfuscation/run_portable.py \
            --clang "${PKG_DIR}/bin/clang" \
            --opt "${PKG_DIR}/bin/opt" \
            --objdump "${PKG_DIR}/bin/llvm-objdump" \
            --work-dir build-llvm-project/portable-release-smoke \
            "${EXTRA_ARGS[@]}"

      - name: Verify portable transforms from archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgDir = Join-Path 'dist/verify' "llvm-obfuscator-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          python tests/obfuscation/run_portable.py `
            --clang (Join-Path $pkgDir 'bin/clang.exe') `
            --opt (Join-Path $pkgDir 'bin/opt.exe') `
            --objdump (Join-Path $pkgDir 'bin/llvm-objdump.exe') `
            --work-dir build-llvm-project/portable-release-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify real HTTPS clients from archive (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          PKG_DIR="dist/verify/llvm-obfuscator-${GITHUB_REF_NAME}-${{ matrix.target }}"
          python tests/obfuscation/test_http_programs.py \
            --clang "${PKG_DIR}/bin/clang" \
            --opt "${PKG_DIR}/bin/opt" \
            --work-dir build-llvm-project/http-integration

      - name: Upload emitted IR on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-ir-${{ matrix.target }}
          path: |
            build-llvm-project/portable-release-smoke/**/*.ll
            build-llvm-project/http-integration/*.ll
          if-no-files-found: ignore

      - name: Upload intermediate archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release and upload archives
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Download all intermediate artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded artifacts
        run: find dist -type f -name "*.zip" -print

      - name: Create release and upload archives with gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          TAG="${GITHUB_REF_NAME}"
          FILES=(dist/**/*.zip)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release archives found."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading with --clobber."
          else
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --title "$TAG" \
              --notes "Automated release for $TAG"
          fi

          gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GH_REPO"
